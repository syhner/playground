[project]
name = "modules_py_api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["fastapi>=0.116.1", "mangum>=0.19.0", "modules_py_core", "sst"]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
modules_py_core = { workspace = true }
sst = { git = "https://github.com/sst/sst.git", branch = "dev", subdirectory = "sdk/python" }

[dependency-groups]
dev = ["httpx>=0.28.1"]
