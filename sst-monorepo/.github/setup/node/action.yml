name: Setup node
description: Sets up node environment

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    
    - name: Install node dependencies
      shell: bash
      run: pnpm install
