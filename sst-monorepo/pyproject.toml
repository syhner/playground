[project]
name = "cdss"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.uv.sources]
sst = { git = "https://github.com/sst/sst.git", subdirectory = "sdk/python", branch = "dev" }

[tool.uv.workspace]
# Once https://github.com/sst/sst/issues/5704 is resolved, python modules can be moved out of the root folder
# members = ["modules-py/*"]
members = ["modules_py_*"]

[dependency-groups]
dev = ["mypy>=1.17.1", "pytest>=8.4.1", "ruff>=0.12.10"]

[tool.mypy]
files = ["modules_py_*"]
exclude = ["sst.pyi"]

[tool.ruff]
extend-exclude = ["sst.pyi"]

[tool.ruff.lint.per-file-ignores]
"modules_py_*/**/test_*.py" = ["E402"]
